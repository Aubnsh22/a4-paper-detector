[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a4-paper-detector"
version = "0.2.0"
description = "A4 paper corner detection and reference validation with OpenCV."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ayoub Nassih"}]
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<6"]
keywords = ["a4", "paper-detection", "opencv", "computer-vision", "homography"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
a4-detect = "a4_detector.cli:main"
a4-detect-folder = "a4_detector.folder_cli:main"

[project.urls]
Repository = "https://github.com/Aubnsh22/a4-paper-detector"
Issues = "https://github.com/Aubnsh22/a4-paper-detector/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a4_detector = ["reference_policy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
